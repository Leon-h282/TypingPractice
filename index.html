<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypingPractice</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="page-title">TYPING PRACTICE</h1>

    <div id="typing-container">
        <div id="timerNerror">
            <select name="times" id="select-time">
                <option value="10">10</option>
                <option value="30">30</option>
                <option value="60">60</option>
            </select>
            <h2 id="countdown"></h2>

            <p id="error-box">error</p>
        </div>
        
        <div id="text-box">
            <p id="typing-content"></p>

            <!-- Hidden input -->
            <input
                type="text"
                id="hidden-input"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                style="position: absolute; opacity: 0; pointer-events: none;"
            />
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
